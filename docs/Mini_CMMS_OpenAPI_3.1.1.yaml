x-contract-validation:
  clock: Все временные сценарии используют явно заданный UTC instant и company_timezone; дата 2030 сама по себе
    не означает будущее.
  patch-preconditions: Все сценарии PATCH, кроме проверки отсутствия/невалидности/устаревания If-Match, используют
    текущий ETag.
  concurrency: Указанный HTTP — ответ проигравшего; пара исходов и итоговые инварианты обязательны в expected_effect.
  transport: expected_http_status=null означает отсутствие HTTP-ответа, не HTTP 0.
x-visibility-rules:
  PUBLIC: Нет аутентификации; bearer, если передан, не нужен для доступа.
  SELF: Текущий пользователь из действующей сессии.
  ALL: Все объекты области; ADMIN не получает это правило в производственных областях.
  AUTHOR: author_id == current_user.id.
  ASSIGNEE: assignee_id == current_user.id; прежнее назначение после reassign доступа не даёт.
  RELATED_ASSIGNMENT: Объект связан с заявкой, у которой assignee_id == current_user.id, включая терминальные заявки.
  NOT_ARCHIVED: equipment.archived_at == null.
  PERFORMER: work_history.technician_id == current_user.id.
  AUTHOR_HISTORY: История связана с заявкой, у которой author_id == current_user.id.
  RECIPIENT: notification.recipient_id == current_user.id.
