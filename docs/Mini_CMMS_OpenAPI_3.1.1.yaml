  /work-orders:
    get:
      tags:
      - Заявки
      operationId: listWorkOrders
      summary: Список заявок
      description: 'ENGINEER — все, TECHNICIAN — assignee_id=current_user, OPERATOR — author_id=current_user. Все
        фильтры объединяются AND, q ищет подстроку в number/title/description без учёта регистра. sort: created_at/-created_at/status/-status;
        по умолчанию -created_at. Статусы ранжируются CREATED,ASSIGNED,IN_PROGRESS,COMPLETED,CLOSED,CANCELLED. Для
        сортировки по статусу второй ключ created_at DESC,id DESC; по дате id в том же направлении.'
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: Размер страницы.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
        description: Пропустить N записей; стабильный порядок определяется сортировкой.
      - name: equipment_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Оборудование.
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
          - REPAIR
          - PLANNED
        description: REPAIR/PLANNED.
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - CREATED
          - ASSIGNED
          - IN_PROGRESS
          - COMPLETED
          - CLOSED
          - CANCELLED
        description: Состояние.
      - name: priority
        in: query
        required: false
        schema:
          type: string
          enum:
          - LOW
          - NORMAL
          - HIGH
          - CRITICAL
        description: Приоритет.
      - name: assignee_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Назначенный техник; ENGINEER видит любого, TECHNICIAN только себя.
      - name: fault_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Неисправность.
      - name: schedule_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Конкретный график ТО.
      - name: q
        in: query
        required: false
        description: Непустая подстрока без учёта регистра в number, title, description; пробелы по краям удаляются.
          % и _ — обычные символы, не SQL wildcards.
        schema:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
        example: масло
      - name: sort
        in: query
        required: false
        description: created_at — ASC, -created_at — DESC. status — порядок CREATED, ASSIGNED, IN_PROGRESS, COMPLETED,
          CLOSED, CANCELLED; -status обратный. При равной дате id в том же направлении; при равном статусе created_at
          DESC,id DESC.
        schema:
          type: string
          enum:
          - created_at
          - -created_at
          - status
          - -status
          default: -created_at
        example: status
      responses:
        '200':
          description: Успешное выполнение
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderPage'
