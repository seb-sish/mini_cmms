openapi: 3.1.1
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Mini-CMMS — REST API
  version: 1.0.0
  summary: Контракт API учебного MVP технического обслуживания оборудования
  description: '# Согласованный контракт учебного MVP; реализация API отсутствует

    Источник: Mini_CMMS_Пункт_2_Требования.docx с согласованным дополнением от 23.10.2026.

    Документ Пункт_3_Проект.docx не предоставлен и не используется как проверенное основание.

    Нормативные правила, матрица доступа, транзакции, даты и реестр согласования:

    Mini_CMMS_API_Design_Notes.md. Примеры и воспроизводимые сквозные проверки:

    Mini_CMMS_API_Acceptance.md и Mini_CMMS_API_Examples.yaml. Каталог граничных случаев

    синхронизирован с x-corner-cases и Mini_CMMS_API_Test_Cases.csv.


    REST JSON /api/v1; UUID; даты YYYY-MM-DD; timestamps UTC RFC3339 с Z.

    Календарные операции используют серверную company_timezone (IANA; примеры Europe/Moscow).

    Одна роль на пользователя. Opaque bearer-сессия на 12 часов, без refresh; logout отзывает

    текущую сессию, блокировка и смена пароля — все сессии; права текущей роли применяются сразу.

    ADMIN управляет только пользователями. ENGINEER управляет производственными данными.

    TECHNICIAN видит назначенные ему заявки, связанные с ними объекты и историю завершённых им работ.

    OPERATOR видит неархивное оборудование, собственные неисправности/заявки и связанную историю.

    После переназначения незавершённая заявка прежнему технику недоступна. Смена роли не удаляет

    данные и не сохраняет прежние полномочия. Чужой конкретный объект — 404, запрещённая роль — 403.


    Заявка: CREATED → ASSIGNED → IN_PROGRESS → COMPLETED → CLOSED.

    ENGINEER может отменить CREATED/ASSIGNED с причиной: CANCELLED — терминальное состояние.

    CLOSED/CANCELLED неизменяемы. History формируется только при CLOSED. Отмена не меняет

    неисправность или даты ТО и освобождает активный слот. Плановый наряд создаётся вручную;

    ARQ создаёт только внутрисистемные напоминания. Формула завершения раннего ТО:

    local_date(completed_at)+interval_days > planned_due_on. Следующий срок после CLOSED

    рассчитывается от фактической даты COMPLETED, в одной транзакции с историей и событием.


    PATCH: application/json; пропущенное поле без изменения; null только где явно разрешён;

    пустой объект и лишние поля — 422. Каждый PATCH требует сильный If-Match; нет — 428,

    устарел — 412. ETag и version относятся к представлению ресурса; checklist использует заявку.

    Ошибки application/problem+json (RFC9457); status совпадает с HTTP, code — стабильный код.

    Сначала аутентификация/роль/видимость, затем валидация, precondition и бизнес-конфликты.

    Создание — 201 с Location; logout — 204 без тела. Списки {items,total,limit,offset},

    limit=1..100 по умолчанию 20; total учитывает фильтры и видимость. Сортировка стабильна,

    но offset-пагинация не обещает snapshot между запросами при параллельных изменениях.

    Файлы, QR, IoT, склад, почта, Telegram, refresh и публичная регистрация вне MVP.

    '
  contact:
    name: Учебная команда Mini-CMMS
servers:
- url: /api/v1
  description: Текущий хост и версия API
tags:
- name: Диагностика
  description: Проверка базовой работоспособности
- name: Авторизация
  description: Логин, сессия и выход
- name: Пользователи
  description: Администрирование учетных записей
- name: Оборудование
  description: Карточки, поиск, архивирование
- name: Неисправности
  description: Регистрация и отслеживание отказов
- name: Регламенты ТО
  description: Шаблоны обслуживания
- name: График ТО
  description: Индивидуальные даты обслуживания оборудования
- name: Заявки
  description: Ремонтные и плановые наряды
- name: История работ
  description: Только чтение, после закрытия наряда
- name: Уведомления
  description: Внутрисистемные события по датам ТО
security:
- BearerAuth: []
paths:
  /health:
    get:
      tags:
      - Диагностика
      operationId: getHealth
      summary: Проверка статуса HTTP сервиса
      description: 'Liveness: 200 status=ok, если HTTP endpoint отвечает; БД, Redis и worker не опрашиваются. Остановка
        процесса — транспортная ошибка без HTTP-статуса. Readiness проверяется отдельно через /ready.'
      responses:
        '200':
          description: Успешное выполнение
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                работает:
                  summary: работает
                  value:
                    status: ok
                    service: mini-cmms-api
                    version: 1.0.0
      security: []
      x-functional-requirements:
      - НФТ-01
      x-corner-cases:
      - id: getHealth.C01
        case: API функционирует без БД
        request_or_state: Запущен HTTP-сервер, PostgreSQL недоступна
        expected_http_status: 200
        expected_error_code: null
        expected_effect: Health не является readiness probe
      - id: getHealth.P01
        case: Успешный запрос
        request_or_state: Изолированная фикстура из Mini_CMMS_API_Examples.yaml; текущая допустимая роль; первый
          положительный пример operation.requestBody (если есть); валидные path/query; текущий If-Match для PATCH;
          допустимое состояние ресурса
        expected_http_status: 200
        expected_error_code: null
        expected_effect: 'Ответ соответствует объявленной схеме и положительному примеру; 201: Location указывает
          на возвращённый id; 204: пустое тело; изменение атомарно и доступно повторным GET; права и побочные эффекты
          по Design Notes'
      x-allowed-roles: []
      x-object-visibility:
        anonymous: PUBLIC
  /ready:
    get:
      tags:
      - Диагностика
      operationId: getReadiness
      summary: Проверка готовности инфраструктуры
      description: 'Readiness: 200 при успешной проверке PostgreSQL и Redis, иначе 503 DEPENDENCY_UNAVAILABLE. Не
        подтверждает выполнение бизнес-процесса или исправность ARQ worker; worker проверяется отдельным контролируемым
        tick и наблюдением результата.'
      responses:
        '200':
          description: Успешное выполнение
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                готов:
                  summary: готов
                  value:
                    status: ok
                    service: mini-cmms-api
                    version: 1.0.0
                готов после обновления:
                  summary: готов после обновления
                  value:
                    status: ok
                    service: mini-cmms-api
                    version: 1.0.0
        '503':
          description: Сервис временно недоступен
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ProblemDetail'
                - properties:
                    status:
                      const: 503
                    code:
                      enum:
                      - DEPENDENCY_UNAVAILABLE
              examples:
                typical:
                  summary: '503: основной случай'
                  value:
                    type: https://mini-cmms.example/problems/dependency-unavailable
                    title: Сервис временно недоступен
                    status: 503
                    detail: База данных или другой обязательный компонент недоступен.
                    code: DEPENDENCY_UNAVAILABLE
                    instance: /api/v1/ready
                db:
                  summary: '503: БД недоступна'
                  value:
                    type: https://mini-cmms.example/problems/dependency-unavailable
                    title: Сервис временно недоступен
                    status: 503
                    detail: Соединение с PostgreSQL недоступно.
                    code: DEPENDENCY_UNAVAILABLE
                    instance: /api/v1/ready
      security: []
      x-functional-requirements:
      - НФТ-01
      x-corner-cases:
      - id: getReadiness.C01
        case: Проверка зависимости
        request_or_state: PostgreSQL недоступна
        expected_http_status: 503
        expected_error_code: DEPENDENCY_UNAVAILABLE
        expected_effect: Readiness fail; без внутренних деталей соединения
      - id: getReadiness.C02
        case: Redis недоступен
        request_or_state: PostgreSQL доступна, Redis недоступен
        expected_http_status: 503
        expected_error_code: DEPENDENCY_UNAVAILABLE
        expected_effect: Нельзя принимать трафик как полностью готовый
      - id: getReadiness.P01
        case: Успешный запрос
        request_or_state: Изолированная фикстура из Mini_CMMS_API_Examples.yaml; текущая допустимая роль; первый
          положительный пример operation.requestBody (если есть); валидные path/query; текущий If-Match для PATCH;
          допустимое состояние ресурса
        expected_http_status: 200
        expected_error_code: null
        expected_effect: 'Ответ соответствует объявленной схеме и положительному примеру; 201: Location указывает
          на возвращённый id; 204: пустое тело; изменение атомарно и доступно повторным GET; права и побочные эффекты
          по Design Notes'
      x-allowed-roles: []
      x-object-visibility:
        anonymous: PUBLIC
  /auth/login:
    post:
      tags:
      - Авторизация
      operationId: login
      summary: Вход по логину и паролю
      description: 'Не публичная регистрация. После 5 неуспешных попыток с одного IP или логина за 10 минут: 429.
        При блокировке пользователя вход не допускается; ответ не сообщает, существует ли логин. Считаются ответы
        INVALID_CREDENTIALS: скользящее окно 10 минут отдельно по IP и lowercase(login). Если в любом окне уже 5
        неуспешных входов, следующая попытка получает 429 до выхода старейшей из этих попыток из окна; Retry-After
        — число секунд. Успешный вход не обнуляет окна; некорректный JSON/схема не считаются попыткой проверки пароля.
        Проверка лимита и увеличение счётчика атомарны. Пароль не обрезается и не нормализуется.'
      requestBody:
        required: true
        description: JSON-тело запроса. Неописанные поля запрещены.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              учётная запись администратора:
                summary: учётная запись администратора
                value:
                  login: admin
                  password: DemoPass-2026!
              учётная запись инженера:
                summary: учётная запись инженера
                value:
                  login: chief.engineer
                  password: EngineerPass-2026!
      responses:
        '200':
          description: Успешное выполнение
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              examples:
                администратор:
                  summary: администратор
                  value:
                    access_token: demo_opaque_admin_token_placeholder_123456
                    token_type: Bearer
                    expires_at: '2026-10-24T02:00:00Z'
                    user:
                      id: 11111111-1111-4111-8111-111111111111
                      login: admin
                      role: ADMIN
                      status: ACTIVE
                      created_at: '2026-10-23T14:00:00Z'
                      updated_at: '2026-10-23T14:00:00Z'
                      version: 1
                инженер:
                  summary: инженер
                  value:
                    access_token: demo_opaque_engineer_token_placeholder_7890
                    token_type: Bearer
                    expires_at: '2026-10-24T02:00:00Z'
                    user:
                      id: 22222222-2222-4222-8222-222222222222
                      login: chief.engineer
                      role: ENGINEER
                      status: ACTIVE
                      created_at: '2026-10-23T14:00:00Z'
                      updated_at: '2026-10-23T14:00:00Z'
                      version: 1
        '400':
          description: Некорректный JSON
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ProblemDetail'
                - properties:
                    status:
                      const: 400
                    code:
                      enum:
                      - MALFORMED_JSON
              examples:
                malformed_json:
                  value:
                    type: https://mini-cmms.example/problems/malformed-json
                    title: Некорректный JSON
                    status: 400
                    detail: JSON синтаксически некорректен.
                    code: MALFORMED_JSON
                    instance: /api/v1/auth/login
        '401':
          description: Требуется аутентификация
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ProblemDetail'
                - properties:
                    status:
                      const: 401
                    code:
                      enum:
                      - INVALID_CREDENTIALS
              examples:
                неверные данные:
                  summary: Одинаковый ответ для неизвестного логина, пароля и BLOCKED
                  value:
                    type: https://mini-cmms.example/problems/invalid-credentials
                    title: Неверные учётные данные
                    status: 401
                    detail: Неверный логин или пароль.
                    code: INVALID_CREDENTIALS
                    instance: /api/v1/auth/login
          headers:
            WWW-Authenticate:
              description: Схема аутентификации для защищённого API
              schema:
                type: string
                const: Bearer
              example: Bearer
        '422':
          description: Ошибка валидации
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ProblemDetail'
                - properties:
                    status:
                      const: 422
                    code:
                      enum:
                      - VALIDATION_ERROR
              examples:
                typical:
                  summary: '422: основной случай'
                  value:
                    type: https://mini-cmms.example/problems/validation-error
                    title: Ошибка валидации
                    status: 422
                    detail: Проверьте значения и взаимосвязи полей.
                    code: VALIDATION_ERROR
                    instance: /api/v1/auth/login
                field_error:
                  summary: '422: ошибка поля'
                  value:
                    type: https://mini-cmms.example/problems/validation-error
                    title: Ошибка валидации
                    status: 422
                    detail: Периодичность должна быть положительной.
                    code: VALIDATION_ERROR
                    instance: /api/v1/auth/login
                    errors:
                    - field: interval_days
                      message: Периодичность должна быть положительной.
        '429':
          description: Слишком много запросов
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ProblemDetail'
                - properties:
                    status:
                      const: 429
                    code:
                      enum:
                      - RATE_LIMITED
              examples:
                typical:
                  summary: '429: основной случай'
                  value:
                    type: https://mini-cmms.example/problems/rate-limited
                    title: Слишком много запросов
                    status: 429
                    detail: Повторите попытку позднее.
                    code: RATE_LIMITED
                    instance: /api/v1/auth/login
                blocked:
                  summary: '429: повторный вход'
                  value:
                    type: https://mini-cmms.example/problems/rate-limited
                    title: Слишком много запросов
                    status: 429
                    detail: Слишком много неуспешных попыток входа.
                    code: RATE_LIMITED
                    instance: /api/v1/auth/login
          headers:
            Retry-After:
              description: Целое число секунд до ближайшей допустимой попытки входа.
              schema:
                type: integer
                minimum: 1
                maximum: 600
              example: 600
        '503':
          description: Сервис временно недоступен
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ProblemDetail'
                - properties:
                    status:
                      const: 503
                    code:
                      enum:
                      - DEPENDENCY_UNAVAILABLE
              examples:
                typical:
                  summary: '503: основной случай'
                  value:
                    type: https://mini-cmms.example/problems/dependency-unavailable
                    title: Сервис временно недоступен
                    status: 503
                    detail: База данных или другой обязательный компонент недоступен.
                    code: DEPENDENCY_UNAVAILABLE
                    instance: /api/v1/auth/login
                db:
                  summary: '503: БД недоступна'
                  value:
                    type: https://mini-cmms.example/problems/dependency-unavailable
                    title: Сервис временно недоступен
                    status: 503
                    detail: Соединение с PostgreSQL недоступно.
                    code: DEPENDENCY_UNAVAILABLE
                    instance: /api/v1/auth/login
        '415':
          description: Неподдерживаемый Content-Type
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ProblemDetail'
                - properties:
                    status:
                      const: 415
                    code:
                      enum:
                      - UNSUPPORTED_MEDIA_TYPE
              examples:
                unsupported_media_type:
                  value:
                    type: https://mini-cmms.example/problems/unsupported-media-type
                    title: Неподдерживаемый Content-Type
                    status: 415
                    detail: Для этого запроса требуется application/json.
                    code: UNSUPPORTED_MEDIA_TYPE
                    instance: /api/v1/auth/login
      security: []
      x-functional-requirements:
      - ФТ-01
      x-corner-cases:
      - id: login.C01
        case: Неверный пароль
        request_or_state: Существующий login, неверный password
        expected_http_status: 401
        expected_error_code: INVALID_CREDENTIALS
        expected_effect: Одинаковое сообщение как для неизвестного логина
      - id: login.C02
        case: Заблокирован
        request_or_state: status=BLOCKED
        expected_http_status: 401
        expected_error_code: INVALID_CREDENTIALS
        expected_effect: Не выдавать токен, не раскрывать состояние записи
      - id: login.C03
        case: Перебор
        request_or_state: 6-й неуспешный вход за 10 минут
        expected_http_status: 429
        expected_error_code: RATE_LIMITED
        expected_effect: Применить rate limit
      - id: login.C04
        case: Недопустимый пароль
        request_or_state: password из 7 знаков
        expected_http_status: 422
        expected_error_code: VALIDATION_ERROR
        expected_effect: Отклонить по схеме
      - id: login.J01
        case: Повреждённый JSON
        request_or_state: 'Разрешённый пользователь; Content-Type application/json; сырое тело {"broken":'
        expected_http_status: 400
        expected_error_code: MALFORMED_JSON
        expected_effect: Нет записей, событий, изменений версий или отзыва сессий
      - id: login.J02
        case: Неподдерживаемый формат
        request_or_state: Разрешённый пользователь; Content-Type text/plain; тело example
        expected_http_status: 415
        expected_error_code: UNSUPPORTED_MEDIA_TYPE
        expected_effect: Данные не меняются
      - id: login.P01
        case: Успешный запрос
        request_or_state: Изолированная фикстура из Mini_CMMS_API_Examples.yaml; текущая допустимая роль; первый
          положительный пример operation.requestBody (если есть); валидные path/query; текущий If-Match для PATCH;
          допустимое состояние ресурса
        expected_http_status: 200
        expected_error_code: null
        expected_effect: 'Ответ соответствует объявленной схеме и положительному примеру; 201: Location указывает
          на возвращённый id; 204: пустое тело; изменение атомарно и доступно повторным GET; права и побочные эффекты
          по Design Notes'
      x-allowed-roles: []
      x-object-visibility:
        anonymous: PUBLIC
  /auth/me:
    get:
      tags:
      - Авторизация
      operationId: getCurrentUser
      summary: Мой профиль
      description: Заблокированный пользователь получает 401 даже если ранее имел действительный токен.
      responses:
        '200':
          description: Успешное выполнение
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                инженер:
                  summary: инженер
                  value:
                    id: 22222222-2222-4222-8222-222222222222
                    login: chief.engineer
                    role: ENGINEER
                    status: ACTIVE
                    created_at: '2026-10-23T14:00:00Z'
                    updated_at: '2026-10-23T14:00:00Z'
                    version: 1
                оператор:
                  summary: оператор
                  value:
                    id: 44444444-4444-4444-8444-444444444444
                    login: operator.1
                    role: OPERATOR
                    status: ACTIVE
                    created_at: '2026-10-23T14:00:00Z'
                    updated_at: '2026-10-23T14:00:00Z'
                    version: 1
          headers:
            ETag:
              description: 'Сильный ETag текущего представления: "<uuid>:<version>". Для пункта чек-листа используется
                ETag родительской заявки.'
              schema:
                type: string
                pattern: ^"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}:[1-9][0-9]*"$
              example: '"22222222-2222-4222-8222-222222222222:1"'
        '401':
          description: Требуется аутентификация
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ProblemDetail'
                - properties:
                    status:
                      const: 401
                    code:
                      enum:
                      - TOKEN_EXPIRED
                      - UNAUTHENTICATED
              examples:
