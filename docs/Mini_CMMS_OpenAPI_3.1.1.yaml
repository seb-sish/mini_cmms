  /work-orders/{work_order_id}/checklist/{item_id}:
    patch:
      tags:
      - Заявки
      operationId: checkWorkOrderItem
      summary: Отметить пункт чек-листа
      description: Только назначенный TECHNICIAN, только IN_PROGRESS и только PLANNED. Пункт принадлежит snapshot
        наряда. Разрешены отметка и снятие отметки; для unchecked поле checked_at становится null. Закрытая заявка
        неизменяема. Обязателен If-Match. Сначала аутентификация, роль и видимость, затем проверка валидного тела/заголовка
        и версии (412/428), затем бизнес-правила. Успешное фактическое изменение атомарно увеличивает version и
        возвращает ETag; PATCH с текущими значениями возвращает 200 без увеличения version и без события. Возвращает
        WorkChecklistItem и новый ETag родительской WorkOrder, не полную заявку. checked=true устанавливает checked_at
        только при смене false→true; checked=false сбрасывает checked_at=null; изменение только comment не меняет
        checked_at. Поля пункта и версия заявки сохраняются одной транзакцией; чужой item_id возвращает 404.
      parameters:
      - name: work_order_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: UUID объекта (work_order_id).
      - name: item_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: UUID объекта (item_id).
      - name: If-Match
        in: header
        required: true
        description: 'Обязательный сильный ETag из последнего GET. Одно значение; wildcard, слабые ETag и списки
          не поддерживаются (422). Отсутствует: 428; устарел или относится к другому ресурсу: 412. Проверка и запись
          выполняются одной транзакцией. Для checklist/{item_id} берётся ETag родительского WorkOrder.'
        schema:
          type: string
          pattern: ^"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}:[1-9][0-9]*"$
        example: '"aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa:1"'
      requestBody:
        required: true
        description: JSON-тело запроса. Неописанные поля запрещены.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChecklistItemUpdate'
            examples:
              отметить выполнение:
                summary: отметить выполнение
                value:
                  checked: true
                  comment: Масло в норме
              снять отметку:
                summary: снять отметку
                value:
                  checked: false
                  comment: null
      responses:
        '200':
          description: Успешное выполнение
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkChecklistItem'
              examples:
                отмечено:
                  summary: отмечено
                  value:
                    id: bbbbbbbb-cccc-4bbb-8bbb-bbbbbbbbbbbc
                    title: Проверить уровень масла
                    required: true
                    order: 0
                    checked: true
                    comment: Масло в норме
                    checked_at: '2026-10-23T14:20:00Z'
                снята отметка:
                  summary: снята отметка
                  value:
                    id: cccccccc-dddd-4ccc-8ccc-cccccccccccd
                    title: Очистить воздушный фильтр
                    required: true
                    order: 1
                    checked: false
                    comment: null
                    checked_at: null
          headers:
            ETag:
              description: Сильный ETag родительской WorkOrder после изменения пункта.
              schema:
                type: string
                pattern: ^"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}:[1-9][0-9]*"$
              example: '"44444444-dddd-4444-8444-444444444444:4"'
        '400':
          description: Некорректный JSON
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ProblemDetail'
                - properties:
                    status:
                      const: 400
                    code:
                      enum:
                      - MALFORMED_JSON
              examples:
                malformed_json:
                  value:
                    type: https://mini-cmms.example/problems/malformed-json
                    title: Некорректный JSON
                    status: 400
                    detail: JSON синтаксически некорректен.
                    code: MALFORMED_JSON
                    instance: /api/v1/work-orders/aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa/checklist/aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
        '401':
          description: Требуется аутентификация
          content:
