        request_or_state: Одновременно два запроса REPAIR с одним fault_id
        expected_http_status: 409
        expected_error_code: DUPLICATE_ACTIVE_WORK_ORDER
        expected_effect: Атомарно создана лишь одна заявка; ровно один ответ 201, другой 409; без побочных эффектов
          проигравшего
      - id: createWorkOrder.C02
        case: Повтор планового ТО
        request_or_state: Одновременно две заявки на schedule_id+next_due_on
        expected_http_status: 409
        expected_error_code: DUPLICATE_PLANNED_WORK_ORDER
        expected_effect: Атомарно создана лишь одна; ровно один ответ 201, другой 409; без побочных эффектов проигравшего
      - id: createWorkOrder.C03
        case: Оператор создаёт плановое
        request_or_state: role=OPERATOR, type=PLANNED
        expected_http_status: 403
        expected_error_code: ACCESS_DENIED
        expected_effect: Запретить
      - id: createWorkOrder.C04
        case: Неверная пара оборудование/неисправность
        request_or_state: equipment_id != fault.equipment_id
        expected_http_status: 422
        expected_error_code: EQUIPMENT_MISMATCH
        expected_effect: Не сохранять
      - id: createWorkOrder.C05
        case: Нет связи
        request_or_state: type=PLANNED без schedule_id
        expected_http_status: 422
        expected_error_code: VALIDATION_ERROR
        expected_effect: Не создавать
      - id: createWorkOrder.C06
        case: Архивная карточка
        request_or_state: equipment.archived_at != null
        expected_http_status: 409
        expected_error_code: EQUIPMENT_ARCHIVED
        expected_effect: Не создавать
      - id: createWorkOrder.A01
        case: Нет или истёк bearer token
        request_or_state: Authorization header отсутствует или token просрочен
        expected_http_status: 401
        expected_error_code: UNAUTHENTICATED
        expected_effect: Операция не выполняется
      - id: createWorkOrder.A02
        case: Запрещённая роль
        request_or_state: Валидная сессия пользователя без права на действие
        expected_http_status: 403
        expected_error_code: ACCESS_DENIED
        expected_effect: База данных не меняется
      - id: createWorkOrder.A04
        case: Объект не найден
        request_or_state: Валидный, но отсутствующий UUID (или запрещённый к просмотру объект)
        expected_http_status: 404
        expected_error_code: NOT_FOUND
        expected_effect: Не раскрывает чужие ресурсы
      - id: createWorkOrder.B01
        case: Повтор после отмены
        request_or_state: Прежний наряд на fault/schedule имеет CANCELLED
        expected_http_status: 201
        expected_error_code: null
        expected_effect: Новый CREATED; старый CANCELLED неизменен; для schedule тот же planned_due_on разрешён
      - id: createWorkOrder.B02
        case: Гонка создания планового ТО
        request_or_state: Два ENGINEER одновременно создают PLANNED для одного активного schedule
        expected_http_status: 409
        expected_error_code: DUPLICATE_PLANNED_WORK_ORDER
        expected_effect: Один 201, один 409; один наряд, один snapshot, одно событие CREATED; ровно один ответ 201,
          другой 409; без побочных эффектов проигравшего
      - id: createWorkOrder.B03
        case: Выключенный регламент
        request_or_state: schedule относится к enabled=false плану
        expected_http_status: 409
        expected_error_code: INACTIVE_MAINTENANCE_SCHEDULE
        expected_effect: Наряд и событие не создаются
      - id: createWorkOrder.J01
        case: Повреждённый JSON
        request_or_state: 'Разрешённый пользователь; Content-Type application/json; сырое тело {"broken":'
        expected_http_status: 400
        expected_error_code: MALFORMED_JSON
        expected_effect: Нет записей, событий, изменений версий или отзыва сессий
      - id: createWorkOrder.J02
        case: Неподдерживаемый формат
        request_or_state: Разрешённый пользователь; Content-Type text/plain; тело example
        expected_http_status: 415
        expected_error_code: UNSUPPORTED_MEDIA_TYPE
        expected_effect: Данные не меняются
      - id: createWorkOrder.P01
        case: Успешный запрос
        request_or_state: Изолированная фикстура из Mini_CMMS_API_Examples.yaml; текущая допустимая роль; первый
          положительный пример operation.requestBody (если есть); валидные path/query; текущий If-Match для PATCH;
