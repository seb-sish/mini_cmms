              format: uuid
      - if:
          properties:
            status:
              enum:
              - CREATED
              - ASSIGNED
              - IN_PROGRESS
              - CANCELLED
          required:
          - status
        then:
          properties:
            result:
              type: 'null'
            completed_at:
              type: 'null'
            replaced_parts:
              maxItems: 0
      - if:
          properties:
            status:
              enum:
              - COMPLETED
              - CLOSED
          required:
          - status
        then:
          properties:
            result:
              type: string
              minLength: 1
              pattern: \S
            completed_at:
              type: string
              format: date-time
              pattern: Z$
            checklist:
              items:
