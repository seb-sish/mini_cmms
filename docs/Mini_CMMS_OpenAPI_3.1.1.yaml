                    description: Посторонний звук в течение 5 секунд после пуска
                    severity: HIGH
                    status: OPEN
                    author_id: 44444444-4444-4444-8444-444444444444
                    created_at: '2026-10-23T14:00:00Z'
                    updated_at: '2026-10-23T14:20:00Z'
                    version: 1
                изменена критичность:
                  summary: изменена критичность
                  value:
