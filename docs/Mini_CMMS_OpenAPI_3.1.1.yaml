            status:
              enum:
              - CLOSED
          required:
          - status
        then:
          properties:
            closed_at:
              type: string
              format: date-time
              pattern: Z$
      - if:
          properties:
            status:
              enum:
              - CREATED
              - ASSIGNED
              - IN_PROGRESS
              - COMPLETED
              - CANCELLED
          required:
          - status
        then:
          properties:
