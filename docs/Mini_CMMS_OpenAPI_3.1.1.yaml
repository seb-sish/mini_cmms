          - type: 'null'
        next_due_on:
          type: string
          format: date
        is_overdue:
          type: boolean
          description: active=true AND next_due_on < local_today AND нет COMPLETED заявки на текущий срок; в сам
            день ТО false. Вычисляется в часовом поясе предприятия.
        has_current_work_order:
          type: boolean
          description: Есть наряд данного графика и текущего next_due_on в CREATED/ASSIGNED/IN_PROGRESS/COMPLETED;
            CLOSED/CANCELLED не учитываются.
        active:
          type: boolean
          description: Вычисляется из plan.enabled, отсутствия архива оборудования и соответствия области плана.
            Пауза не меняет сохранённые даты. Пара plan_id+equipment_id уникальна за всё время.
        created_at:
          type: string
          format: date-time
          pattern: Z$
        updated_at:
          type: string
          format: date-time
          pattern: Z$
      required:
      - id
      - plan_id
      - equipment_id
      - last_completed_on
      - next_due_on
      - is_overdue
      - has_current_work_order
      - active
