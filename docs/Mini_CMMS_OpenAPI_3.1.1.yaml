  /notifications/{notification_id}:
    get:
      tags:
      - Уведомления
      operationId: getNotification
      summary: Открыть уведомление
      description: 'Только получатель. Другой получатель -> 404, в том числе ADMIN. Не изменяет отметку прочтения.
        Генерация: один tick не реже раза в час в TZ предприятия. Для активного графика без COMPLETED на текущий
        срок: в T−3..T−1 включительно THREE_DAYS_BEFORE; с T и до выполнения ON_DUE_DATE. После простоя генерируется
        только актуальный тип. Получатели — все ACTIVE ENGINEER и текущий ACTIVE TECHNICIAN назначенного наряда
        ASSIGNED/IN_PROGRESS. При позднем назначении следующий tick уведомляет нового получателя, если окно ещё
        актуально. UNIQUE(schedule_id,planned_due_on,type,recipient_id); повторные/параллельные tick не создают
        дубли. При CANCELLED график остаётся актуальным. При COMPLETED, паузе графика, выключенном плане или архиве
        оборудования новых уведомлений нет. Ранее созданные записи сохраняются и видны только своему получателю
        с текущей допустимой ролью; они являются историей, а не гарантией актуальности задания. Изменение срока
        не удаляет старые записи.'
