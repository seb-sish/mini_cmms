    patch:
      tags:
      - Регламенты ТО
      operationId: updateMaintenancePlan
      summary: Изменить регламент ТО
      description: 'Только ENGINEER. Изменение scope запрещено. Новый чек-лист применяется только к будущим нарядам,
        у активных остаётся snapshot. Изменение interval_days запрещено, если есть незакрытые PLANNED заявки для
        данного регламента. Обязателен If-Match. Сначала аутентификация, роль и видимость, затем проверка валидного
        тела/заголовка и версии (412/428), затем бизнес-правила. Успешное фактическое изменение атомарно увеличивает
        version и возвращает ETag; PATCH с текущими значениями возвращает 200 без увеличения version и без события.
        При смене interval_days запрет действует на все незавершённые PLANNED данного регламента, включая COMPLETED;
        CLOSED/CANCELLED не блокируют. Для всех его графиков, включая неактивные: если last_completed_on=null, сохранить
        текущий next_due_on; иначе next_due_on=last_completed_on+новый интервал. Если новый срок не позже последнего
        CLOSED planned_due_on данного графика — 409 NON_ADVANCING_DUE_DATE. Изменение регламента и всех дат атомарно:
        при одном конфликте полный откат. enabled=false приостанавливает графики и новые наряды/напоминания, но
        активные наряды можно закончить. При enabled=true подходящие графики возобновляются с сохранёнными датами.
        Существующие уведомления неизменяемы. Новый checklist действует только для новых нарядов.'
      parameters:
      - name: plan_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: UUID объекта (plan_id).
      - name: If-Match
        in: header
        required: true
        description: 'Обязательный сильный ETag из последнего GET. Одно значение; wildcard, слабые ETag и списки
          не поддерживаются (422). Отсутствует: 428; устарел или относится к другому ресурсу: 412. Проверка и запись
          выполняются одной транзакцией. Для checklist/{item_id} берётся ETag родительского WorkOrder.'
        schema:
          type: string
          pattern: ^"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}:[1-9][0-9]*"$
        example: '"aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa:1"'
      requestBody:
        required: true
        description: JSON-тело запроса. Неописанные поля запрещены.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenancePlanPatch'
            examples:
              переименование:
                summary: переименование
                value:
                  name: ТО компрессоров (ежемесячное)
              остановить график:
                summary: остановить график
                value:
                  enabled: false
              увеличить период:
                summary: увеличить период
                value:
                  interval_days: 45
      responses:
        '200':
          description: Успешное выполнение
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenancePlan'
              examples:
                новое имя:
                  summary: новое имя
                  value:
                    id: eeeeeeee-eeee-4eee-8eee-eeeeeeeeeeee
                    name: ТО компрессоров (ежемесячное)
                    scope: CATEGORY
                    equipment_id: null
                    category: Компрессоры
                    interval_days: 30
                    first_due_on: '2026-11-05'
                    checklist:
                    - id: 99999999-aaaa-4999-8999-999999999999
                      title: Проверить уровень масла
                      required: true
                      order: 0
                    - id: aaaaaaaa-bbbb-4aaa-8aaa-aaaaaaaaaaab
                      title: Очистить воздушный фильтр
                      required: true
                      order: 1
                    enabled: true
                    created_at: '2026-10-23T14:00:00Z'
                    updated_at: '2026-10-23T14:20:00Z'
                    version: 1
                отключён:
                  summary: отключён
                  value:
                    id: ffffffff-ffff-4fff-8fff-ffffffffffff
                    name: ТО насоса Н-7
                    scope: EQUIPMENT
                    equipment_id: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
                    category: null
                    interval_days: 90
                    first_due_on: '2026-11-01'
                    checklist:
                    - id: 99999999-aaaa-4999-8999-999999999999
                      title: Проверить уровень масла
