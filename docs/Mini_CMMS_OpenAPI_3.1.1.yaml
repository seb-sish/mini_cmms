    patch:
      tags:
      - Неисправности
      operationId: updateFault
      summary: Исправить описание неисправности
      description: Только автор либо ENGINEER; разрешено пока OPEN и к неисправности не привязана активная заявка.
        Статус изменяется системой, а не PATCH. Обязателен If-Match. Сначала аутентификация, роль и видимость, затем
        проверка валидного тела/заголовка и версии (412/428), затем бизнес-правила. Успешное фактическое изменение
        атомарно увеличивает version и возвращает ETag; PATCH с текущими значениями возвращает 200 без увеличения
        version и без события.
      parameters:
      - name: fault_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: UUID объекта (fault_id).
      - name: If-Match
        in: header
        required: true
        description: 'Обязательный сильный ETag из последнего GET. Одно значение; wildcard, слабые ETag и списки
          не поддерживаются (422). Отсутствует: 428; устарел или относится к другому ресурсу: 412. Проверка и запись
          выполняются одной транзакцией. Для checklist/{item_id} берётся ETag родительского WorkOrder.'
        schema:
          type: string
          pattern: ^"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}:[1-9][0-9]*"$
        example: '"aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa:1"'
      requestBody:
        required: true
        description: JSON-тело запроса. Неописанные поля запрещены.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FaultPatch'
            examples:
              описание:
                summary: описание
                value:
                  description: Посторонний звук в течение 5 секунд после пуска
              критичность:
                summary: критичность
                value:
                  severity: CRITICAL
      responses:
        '200':
          description: Успешное выполнение
          content:
