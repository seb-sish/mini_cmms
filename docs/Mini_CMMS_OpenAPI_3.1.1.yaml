    patch:
      tags:
      - Заявки
      operationId: updateWorkOrder
      summary: Изменить описание и приоритет заявки
      description: Только ENGINEER, только в CREATED. Тип, источник и оборудование после создания неизменяемы. Для
        чужой заявки возвращается 404; для уже назначенной — 409. Обязателен If-Match. Сначала аутентификация, роль
        и видимость, затем проверка валидного тела/заголовка и версии (412/428), затем бизнес-правила. Успешное
        фактическое изменение атомарно увеличивает version и возвращает ETag; PATCH с текущими значениями возвращает
        200 без увеличения version и без события.
      parameters:
      - name: work_order_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: UUID объекта (work_order_id).
      - name: If-Match
        in: header
        required: true
        description: 'Обязательный сильный ETag из последнего GET. Одно значение; wildcard, слабые ETag и списки
          не поддерживаются (422). Отсутствует: 428; устарел или относится к другому ресурсу: 412. Проверка и запись
          выполняются одной транзакцией. Для checklist/{item_id} берётся ETag родительского WorkOrder.'
        schema:
          type: string
          pattern: ^"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}:[1-9][0-9]*"$
        example: '"aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa:1"'
      requestBody:
        required: true
        description: JSON-тело запроса. Неописанные поля запрещены.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkOrderPatch'
            examples:
              приоритет:
                summary: приоритет
                value:
                  priority: CRITICAL
              описание:
                summary: описание
                value:
                  description: Проверить подшипник двигателя компрессора
      responses:
