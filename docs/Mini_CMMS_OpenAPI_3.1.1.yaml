                  summary: уточнено описание
                  value:
                    id: 33333333-cccc-4333-8333-333333333333
                    number: WO-2026-0001
                    type: REPAIR
                    equipment_id: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
