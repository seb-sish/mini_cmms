          текущий (после проверки аутентификации и видимости)
        expected_http_status: 409
        expected_error_code: NON_ADVANCING_DUE_DATE
        expected_effect: Регламент, все графики и версии не меняются
      - id: updateMaintenancePlan.B02
        case: Нет первого ТО
        request_or_state: last_completed_on=null, first_due_on=2026-01-01, next_due_on=2026-10-23; новый интервал;
          If-Match текущий (после проверки аутентификации и видимости)
        expected_http_status: 200
        expected_error_code: null
        expected_effect: next_due_on остаётся 2026-10-23, не возвращается на first_due_on
      - id: updateMaintenancePlan.J01
        case: Повреждённый JSON
        request_or_state: Разрешённый пользователь; Content-Type application/json; сырое тело {"broken":; If-Match
          текущий (после проверки аутентификации и видимости)
        expected_http_status: 400
        expected_error_code: MALFORMED_JSON
        expected_effect: Нет записей, событий, изменений версий или отзыва сессий
      - id: updateMaintenancePlan.J02
        case: Неподдерживаемый формат
