  /notifications:
    get:
      tags:
      - Уведомления
      operationId: listNotifications
      summary: Мои внутрисистемные уведомления
      description: 'Возвращает только уведомления текущего пользователя (ENGINEER или TECHNICIAN). Получателя нельзя
        выбрать параметром. Уведомления создаёт фоновая ARQ задача за 3 календарных дня и в день ТО, повторное выполнение
        задачи не создаёт дублей. Нет API подтверждения прочтения в обязательном MVP. Генерация: один tick не реже
        раза в час в TZ предприятия. Для активного графика без COMPLETED на текущий срок: в T−3..T−1 включительно
        THREE_DAYS_BEFORE; с T и до выполнения ON_DUE_DATE. После простоя генерируется только актуальный тип. Получатели
        — все ACTIVE ENGINEER и текущий ACTIVE TECHNICIAN назначенного наряда ASSIGNED/IN_PROGRESS. При позднем
        назначении следующий tick уведомляет нового получателя, если окно ещё актуально. UNIQUE(schedule_id,planned_due_on,type,recipient_id);
        повторные/параллельные tick не создают дубли. При CANCELLED график остаётся актуальным. При COMPLETED, паузе
        графика, выключенном плане или архиве оборудования новых уведомлений нет. Ранее созданные записи сохраняются
        и видны только своему получателю с текущей допустимой ролью; они являются историей, а не гарантией актуальности
        задания. Изменение срока не удаляет старые записи. Стабильная сортировка: created_at DESC,id DESC.'
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: Размер страницы.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
        description: Пропустить N записей; стабильный порядок определяется сортировкой.
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
          - THREE_DAYS_BEFORE
          - ON_DUE_DATE
        description: Тип уведомления
      - name: planned_due_on
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Дата планового ТО
      responses:
        '200':
          description: Успешное выполнение
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
              examples:
                два уведомления:
                  summary: два уведомления
                  value:
                    items:
                    - id: 77777777-aaaa-4777-8777-777777777777
                      recipient_id: 22222222-2222-4222-8222-222222222222
                      plan_id: eeeeeeee-eeee-4eee-8eee-eeeeeeeeeeee
                      schedule_id: 11111111-aaaa-4111-8111-111111111111
                      equipment_id: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
                      planned_due_on: '2026-11-05'
                      type: THREE_DAYS_BEFORE
                      message: До ТО компрессора КМ-12 осталось 3 дня
                      created_at: '2026-11-02T09:00:00Z'
                    - id: 88888888-bbbb-4888-8888-888888888888
                      recipient_id: 22222222-2222-4222-8222-222222222222
                      plan_id: eeeeeeee-eeee-4eee-8eee-eeeeeeeeeeee
                      schedule_id: 11111111-aaaa-4111-8111-111111111111
                      equipment_id: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
                      planned_due_on: '2026-11-05'
                      type: ON_DUE_DATE
                      message: Сегодня запланировано ТО компрессора КМ-12
                      created_at: '2026-11-05T09:00:00Z'
                    total: 2
                    limit: 20
                    offset: 0
                пустой список:
                  summary: пустой список
                  value:
                    items: []
                    total: 0
                    limit: 20
