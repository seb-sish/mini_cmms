    patch:
      tags:
      - Пользователи
      operationId: patchUser
      summary: Изменить роль, состояние или пароль сотрудника
      description: Только ADMIN. Требование не блокировать последнего активного ADMIN. При BLOCKED все активные
        токены этого пользователя немедленно отзываются. Назначенные заявки и история сохраняются. Обязателен If-Match.
        Сначала аутентификация, роль и видимость, затем проверка валидного тела/заголовка и версии (412/428), затем
        бизнес-правила. Успешное фактическое изменение атомарно увеличивает version и возвращает ETag; PATCH с текущими
        значениями возвращает 200 без увеличения version и без события.
