      - fault_id
      - schedule_id
      - planned_due_on
      - title
      - description
      - priority
      - status
      - author_id
      - assignee_id
      - checklist
      - result
      - replaced_parts
      - completed_at
      - created_at
      - updated_at
      - closed_at
      - version
      - cancelled_at
      - cancelled_by
      - cancellation_reason
      allOf:
      - if:
          properties:
            type:
              const: REPAIR
          required:
          - type
        then:
          properties:
            schedule_id:
              type: 'null'
            planned_due_on:
              type: 'null'
            checklist:
              maxItems: 0
      - if:
          properties:
            type:
              const: PLANNED
          required:
          - type
        then:
          properties:
            fault_id:
              type: 'null'
            schedule_id:
              type: string
              format: uuid
            planned_due_on:
              type: string
              format: date
            checklist:
              minItems: 1
      - if:
          properties:
            status:
              enum:
              - CREATED
          required:
          - status
        then:
          properties:
            assignee_id:
              type: 'null'
      - if:
          properties:
            status:
              enum:
              - ASSIGNED
              - IN_PROGRESS
              - COMPLETED
              - CLOSED
          required:
          - status
        then:
          properties:
            assignee_id:
