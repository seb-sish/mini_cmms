                    version: 1
          headers:
            ETag:
              description: 'Сильный ETag текущего представления: "<uuid>:<version>". Для пункта чек-листа используется
                ETag родительской заявки.'
              schema:
                type: string
                pattern: ^"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}:[1-9][0-9]*"$
              example: '"cccccccc-cccc-4ccc-8ccc-cccccccccccc:1"'
        '400':
          description: Некорректный JSON
          content:
