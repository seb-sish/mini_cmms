        expected_http_status: 422
        expected_error_code: VALIDATION_ERROR
        expected_effect: Запрос отклонён на уровне валидации
      - id: updateMaintenancePlan.A04
        case: Объект не найден
        request_or_state: Валидный, но отсутствующий UUID (или запрещённый к просмотру объект); If-Match текущий
          (после проверки аутентификации и видимости)
        expected_http_status: 404
        expected_error_code: NOT_FOUND
        expected_effect: Не раскрывает чужие ресурсы
      - id: updateMaintenancePlan.V01
        case: Отсутствует If-Match
        request_or_state: Разрешённая роль, валидное тело, нет If-Match
        expected_http_status: 428
        expected_error_code: PRECONDITION_REQUIRED
        expected_effect: Нет изменений ресурса, версии, событий и связанных записей
      - id: updateMaintenancePlan.V02
        case: Устаревшая версия
        request_or_state: GET дал версию 1; другой запрос сохранил версию 2; If-Match содержит версию 1
        expected_http_status: 412
        expected_error_code: VERSION_CONFLICT
        expected_effect: Не затирать чужое изменение; версия остаётся 2
      - id: updateMaintenancePlan.V03
        case: Недопустимое условие
        request_or_state: 'If-Match: * либо W/"uuid:1" либо список тегов'
        expected_http_status: 422
        expected_error_code: VALIDATION_ERROR
        expected_effect: Не принимать обход проверки версии
      - id: updateMaintenancePlan.V04
        case: Два PATCH одной версии
        request_or_state: Два разных валидных PATCH с одним текущим If-Match, барьер перед записью
        expected_http_status: 412
        expected_error_code: VERSION_CONFLICT
        expected_effect: Ровно один запрос 200, другой 412; одно увеличение version; только изменение победителя
      - id: updateMaintenancePlan.B01
        case: Возврат на закрытый срок
