    patch:
      tags:
      - Оборудование
      operationId: updateEquipment
      summary: Редактировать оборудование
      description: Только ENGINEER. Нельзя редактировать архивный объект (409). При смене категории будущие CATEGORY-расписания
        пересинхронизируются; расписания с историей не удаляются. Обязателен If-Match. Сначала аутентификация, роль
        и видимость, затем проверка валидного тела/заголовка и версии (412/428), затем бизнес-правила. Успешное
        фактическое изменение атомарно увеличивает version и возвращает ETag; PATCH с текущими значениями возвращает
        200 без увеличения version и без события. График для пары plan_id+equipment_id существует в единственном
        экземпляре за всё время (UNIQUE без active). Архивирование/уход из категории приостанавливают график без
        удаления. При возврате/restore график возобновляется, если equipment подходит и plan.enabled=true; next_due_on
        и last_completed_on сохраняются, включая просрочку. Для впервые подключённой пары next_due_on=max(plan.first_due_on,
        local_today), last_completed_on=null. Смена категории запрещена при незавершённых PLANNED; CLOSED/CANCELLED
        не блокируют.
      parameters:
      - name: equipment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: UUID объекта (equipment_id).
      - name: If-Match
        in: header
        required: true
        description: 'Обязательный сильный ETag из последнего GET. Одно значение; wildcard, слабые ETag и списки
          не поддерживаются (422). Отсутствует: 428; устарел или относится к другому ресурсу: 412. Проверка и запись
          выполняются одной транзакцией. Для checklist/{item_id} берётся ETag родительского WorkOrder.'
        schema:
          type: string
          pattern: ^"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}:[1-9][0-9]*"$
        example: '"aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa:1"'
      requestBody:
        required: true
        description: JSON-тело запроса. Неописанные поля запрещены.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EquipmentPatch'
            examples:
              переезд:
                summary: переезд
                value:
                  location: Цех №3
              вывод из эксплуатации:
                summary: вывод из эксплуатации
                value:
                  status: OUT_OF_SERVICE
