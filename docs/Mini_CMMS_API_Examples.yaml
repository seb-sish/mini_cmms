execution_notes:
- Каждый flow запускается на новой БД/транзакционной фикстуре initial_state; initial_state не является HTTP API.
- В fixture accounts хранятся только синтетические тестовые пароли; их хеширует тестовая фабрика.
- Для actor используются сессии, полученные отдельным login или test setup; статические токены здесь — образцы,
  не рабочие credentials.
- clock_utc задаётся зависимостью часов в тестовой среде, не публичным endpoint.
- Новые UUID, number, токены, event/history ids связываются с фактическим ответом и подставляются в следующие шаги;
  остальные значения и побочные эффекты сравниваются.
- expected_body — полное представление состояния для этой фикстуры; статическая проверка не выполняет HTTP и не
  доказывает postconditions.
