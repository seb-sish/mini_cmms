services:
  backend:
    container_name: mini_cmms_backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env.example
    environment:
      - DB_DSN=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-mini_cmms}
      - REDIS_URL=redis://redis:6379/0
      - APP_COMPANY_TIMEZONE=${APP_COMPANY_TIMEZONE:-Europe/Moscow}
      - APP_CORS_ORIGINS=${APP_CORS_ORIGINS:-*}
      - SECURITY_TOKEN_EXPIRE_HOURS=${SECURITY_TOKEN_EXPIRE_HOURS:-12}
      - SECURITY_RATE_LIMIT_MAX_ATTEMPTS=${SECURITY_RATE_LIMIT_MAX_ATTEMPTS:-5}
      - SECURITY_RATE_LIMIT_WINDOW_SECONDS=${SECURITY_RATE_LIMIT_WINDOW_SECONDS:-600}
      - SECURITY_FIRST_ADMIN_LOGIN=${SECURITY_FIRST_ADMIN_LOGIN:-admin}
      - SECURITY_FIRST_ADMIN_PASSWORD=${SECURITY_FIRST_ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  migrate:
    container_name: mini_cmms_migrate
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env.example
    environment:
      - DB_DSN=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-mini_cmms}
      - APP_COMPANY_TIMEZONE=${APP_COMPANY_TIMEZONE:-Europe/Moscow}
    command: >
      bash -c "uv run alembic upgrade head"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  arq-worker:
    container_name: mini_cmms_arq_worker
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.example
    environment:
      - DB_DSN=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-mini_cmms}
      - REDIS_URL=redis://redis:6379/0
      - APP_COMPANY_TIMEZONE=${APP_COMPANY_TIMEZONE:-Europe/Moscow}
      - APP_CORS_ORIGINS=${APP_CORS_ORIGINS:-*}
      - SECURITY_RATE_LIMIT_MAX_ATTEMPTS=${SECURITY_RATE_LIMIT_MAX_ATTEMPTS:-5}
      - SECURITY_RATE_LIMIT_WINDOW_SECONDS=${SECURITY_RATE_LIMIT_WINDOW_SECONDS:-600}
    command: >
      uv run arq app.worker.main.WorkerSettings
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  postgres:
    image: postgres:16-alpine
    container_name: mini_cmms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-mini_cmms}
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mini_cmms}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mini_cmms_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
