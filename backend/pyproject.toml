[project]
name = "mini-cmms-backend"
version = "1.0.0"
description = "Mini-CMMS Backend API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "arq>=0.26.0",
    "argon2-cffi>=23.1.0",
    "python-multipart>=0.0.12",
    "structlog>=24.4.0",
    "rich>=13.8.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "fakeredis[aioredis]>=2.25.0",
    "ruff>=0.6.0",
    "aiosqlite>=0.22.1",
    "jsonschema[format]>=4.26.0",
    "openapi-spec-validator>=0.9.0",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: marks tests as integration tests that use real external services (PostgreSQL, Redis)",
    "contract: marks tests as schema and contract conformance tests against OpenAPI spec",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F841"]
"app/db/alembic/*" = ["F401", "E402"]
